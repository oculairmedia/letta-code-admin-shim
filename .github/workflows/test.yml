name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# admin-shim has direct native deps (node-pty, sharp). node-pty in particular
# has no prebuilt binary for this runner's Node/platform combo, so `npm ci`
# COMPILES it from source every run — fetching node headers from nodejs.org,
# which intermittently ETIMEDOUTs and pushed install time past the job cap,
# failing every PR's shim-tests with an empty log even though the suite runs
# in ~8s. The shim tests are fully mocked and never spawn a PTY.
#
# Fix: cache the compiled node_modules keyed on the lockfile so the native
# build happens at most once per lockfile change, then is reused. Restored
# cache hits skip `npm ci` entirely.

jobs:
  shim-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache shim node_modules
        id: shim-node-modules
        uses: actions/cache@v4
        with:
          path: admin-shim/node_modules
          key: shim-node-modules-${{ runner.os }}-node20-${{ hashFiles('admin-shim/package-lock.json') }}

      - name: Install shim deps
        if: steps.shim-node-modules.outputs.cache-hit != 'true'
        working-directory: admin-shim
        run: npm ci

      - name: Run shim tests
        working-directory: admin-shim
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache shim node_modules
        id: shim-node-modules
        uses: actions/cache@v4
        with:
          path: admin-shim/node_modules
          key: shim-node-modules-${{ runner.os }}-node20-${{ hashFiles('admin-shim/package-lock.json') }}

      - name: Install shim deps
        if: steps.shim-node-modules.outputs.cache-hit != 'true'
        working-directory: admin-shim
        run: npm ci

      - name: Run typecheck
        working-directory: admin-shim
        run: npm run typecheck

  # Channel plugin smokes run against a real `letta` binary, so they live
  # behind a manual trigger for now. CI runs the mocked shim tests above
  # which exercise the same protocol surface via captured stream traces.
