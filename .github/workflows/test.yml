name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# admin-shim has direct native deps (node-pty, sharp). node-pty has no prebuilt
# binary for this runner's Node/platform, so a plain `npm ci` COMPILES it from
# source every run, fetching node headers from nodejs.org. That intermittently
# ETIMEDOUTs and blew past the job timeout, getting every PR's shim-tests
# cancelled with an empty log even though the suite runs in ~30s.
#
# The mocked shim tests and `tsc` typecheck never spawn a PTY or use sharp's
# native binary, so we install with `--ignore-scripts` to skip the native
# postinstall builds entirely. Local check: `npm ci --ignore-scripts` drops
# install from >12min to ~3s and the full suite still passes.

jobs:
  shim-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-shim/package-lock.json

      - name: Install shim deps (skip native postinstall builds)
        working-directory: admin-shim
        run: npm ci --ignore-scripts

      - name: Run shim tests
        working-directory: admin-shim
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-shim/package-lock.json

      - name: Install shim deps (skip native postinstall builds)
        working-directory: admin-shim
        run: npm ci --ignore-scripts

      - name: Run typecheck
        working-directory: admin-shim
        run: npm run typecheck

  # Channel plugin smokes run against a real `letta` binary, so they live
  # behind a manual trigger for now. CI runs the mocked shim tests above
  # which exercise the same protocol surface via captured stream traces.
