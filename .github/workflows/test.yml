name: test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# admin-shim has a direct native dep, node-pty, with no prebuilt binary for the
# runner's Node/platform. The shim's mocked tests SPAWN a real shim subprocess,
# which needs node-pty compiled to boot — so we cannot skip the native build.
# The build itself is fast (~6s locally); the flakiness is node-pty's node
# headers download from nodejs.org on GitHub runners, which intermittently
# ETIMEDOUTs and blows past the job timeout, cancelling shim-tests with an
# empty log even though the suite runs in ~30s.
#
# Fix: cache the compiled node_modules keyed on the lockfile so the native
# build + header fetch happen at most once per lockfile change; subsequent
# runs restore the cache and skip `npm ci` entirely. The cold cache-miss run
# gets a generous timeout for the one-time fetch.

jobs:
  shim-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache shim node_modules
        id: shim-cache
        uses: actions/cache@v4
        with:
          path: admin-shim/node_modules
          key: shim-node-modules-${{ runner.os }}-node20-${{ hashFiles('admin-shim/package-lock.json') }}

      - name: Install shim deps
        if: steps.shim-cache.outputs.cache-hit != 'true'
        working-directory: admin-shim
        run: npm ci

      - name: Run shim tests
        working-directory: admin-shim
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache shim node_modules
        id: shim-cache
        uses: actions/cache@v4
        with:
          path: admin-shim/node_modules
          key: shim-node-modules-${{ runner.os }}-node20-${{ hashFiles('admin-shim/package-lock.json') }}

      - name: Install shim deps
        if: steps.shim-cache.outputs.cache-hit != 'true'
        working-directory: admin-shim
        run: npm ci

      - name: Run typecheck
        working-directory: admin-shim
        run: npm run typecheck

  # Build the deployable artifact and parse-validate every emitted file.
  # `typecheck` (tsc --noEmit) catches source errors, but the host runs the
  # EMITTED dist/, and nothing previously verified that the emitted JS even
  # parses. This job builds dist and runs the same whole-tree parse gate the
  # systemd ExecStartPre uses, so a broken artifact fails CI rather than
  # crash-looping on boot (the 2026-06-23 incident).
  verify-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache shim node_modules
        id: shim-cache
        uses: actions/cache@v4
        with:
          path: admin-shim/node_modules
          key: shim-node-modules-${{ runner.os }}-node20-${{ hashFiles('admin-shim/package-lock.json') }}

      - name: Install shim deps
        if: steps.shim-cache.outputs.cache-hit != 'true'
        working-directory: admin-shim
        run: npm ci

      - name: Build dist
        working-directory: admin-shim
        run: npm run build

      - name: Verify emitted dist parses
        working-directory: admin-shim
        run: npm run check:dist

  # Channel plugin smokes run against a real `letta` binary, so they live
  # behind a manual trigger for now. CI runs the mocked shim tests above
  # which exercise the same protocol surface via captured stream traces.
